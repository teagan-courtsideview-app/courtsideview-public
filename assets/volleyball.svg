<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Volleyball">
  <defs>
    <radialGradient id="vbHi" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#20A66B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ball body -->
  <circle cx="32" cy="32" r="28" fill="#20A66B" stroke="#0a0e14" stroke-width="2.5"/>
  <!-- highlight -->
  <circle cx="32" cy="32" r="28" fill="url(#vbHi)"/>
  <!-- panel seams: three curved arcs intersecting in the classic 6-panel pattern -->
  <g fill="none" stroke="#0a0e14" stroke-width="2.2" stroke-linecap="round">
    <path d="M 32 4  C 22 18, 22 46, 32 60"/>
    <path d="M 32 4  C 42 18, 42 46, 32 60"/>
    <path d="M 4 32  C 18 22, 46 22, 60 32"/>
    <path d="M 4 32  C 18 42, 46 42, 60 32"/>
  </g>
  <!-- subtle inner highlight strokes for the lighter green stripes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.36">
    <path d="M 30 6  C 21 19, 21 45, 30 58"/>
    <path d="M 6 30  C 19 21, 45 21, 58 30"/>
  </g>
</svg>
