<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtsideView • Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white text-[#111827]">
  <div class="max-w-[420px] mx-auto min-h-screen flex flex-col">
    <div class="px-6 pt-8 pb-4 flex items-center justify-between border-b">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-[#22C55E] rounded-2xl flex items-center justify-center"><span class="text-white text-2xl font-black">CV</span></div>
        <div><div class="font-semibold text-xl tracking-tight">CourtsideView</div><div class="text-[11px] text-[#6B7280] -mt-1">LIVE</div></div>
      </div>
      <div id="status-pill" class="px-3 py-1 rounded-3xl bg-[#DCFCE7] text-[#166534] text-sm font-medium flex items-center gap-1.5">
        <div class="w-2 h-2 bg-[#22C55E] rounded-full animate-pulse"></div>
        <span id="status-text">LIVE</span>
      </div>
    </div>

    <div class="px-6 pt-6">
      <div class="bg-white border border-[#E5E7EB] rounded-3xl p-6 shadow-sm">
        <div class="flex items-center justify-between mb-6">
          <div class="text-center flex-1">
            <div id="home-name" class="text-[#6B7280] text-sm font-medium">HOME</div>
            <div id="home-score" class="text-[72px] leading-none font-bold tabular-nums">0</div>
          </div>
          <div class="px-4 text-center">
            <div class="text-[10px] text-[#9CA3AF] mb-1">SET</div>
            <div id="current-set" class="inline-flex items-center justify-center w-9 h-9 rounded-2xl bg-[#22C55E] text-white text-xl font-black">1</div>
          </div>
          <div class="text-center flex-1">
            <div id="away-name" class="text-[#6B7280] text-sm font-medium">AWAY</div>
            <div id="away-score" class="text-[72px] leading-none font-bold tabular-nums">0</div>
          </div>
        </div>
        <div id="set-strip" class="flex gap-2 justify-center text-xs text-[#6B7280]"></div>
      </div>
    </div>

    <div class="flex-1 px-6 pt-6 pb-4">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="text-sm font-semibold text-[#374151]">LIVE ACTIVITY</div>
        <button onclick="manualRefresh()" class="text-xs px-3 py-1 bg-[#F3F4F6] hover:bg-[#E5E7EB] rounded-2xl text-[#374151]">REFRESH</button>
      </div>
      <div id="feed" class="space-y-2 text-sm max-h-[300px] overflow-auto pr-1"></div>
      <div id="empty-feed" class="hidden text-center py-8 text-[#9CA3AF] text-sm">Match starting…</div>
      <div id="last-updated" class="text-[10px] text-[#9CA3AF] text-center mt-4"></div>
      
      <!-- DEBUG PANEL -->
      <details class="mt-6 text-xs bg-[#F9FAFB] border border-[#E5E7EB] rounded-2xl p-3">
        <summary class="cursor-pointer text-[#6B7280] font-medium">DEBUG (tap to expand)</summary>
        <pre id="debug" class="mt-2 text-[10px] text-[#374151] overflow-auto max-h-[200px]"></pre>
      </details>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

    let currentShareId = null;
    let lastState = null;
    let pollInterval = null;

    function updateDebug(row) {
      document.getElementById('debug').textContent = JSON.stringify(row, null, 2);
    }

    function getScore(row) {
      const s = row.state || {};
      return {
        home: s.homeScore ?? row.home_score ?? row.state?.homeScore ?? 0,
        away: s.awayScore ?? row.away_score ?? row.state?.awayScore ?? 0,
        set: s.currentSet ?? row.current_set ?? row.state?.currentSet ?? 1
      };
    }

    function renderMatch(row) {
      updateDebug(row);
      const scores = getScore(row);
      document.getElementById('home-score').textContent = scores.home;
      document.getElementById('away-score').textContent = scores.away;
      document.getElementById('current-set').textContent = scores.set;
      document.getElementById('home-name').textContent = (row.home_name || 'HOME').toUpperCase();
      document.getElementById('away-name').textContent = (row.away_name || 'AWAY').toUpperCase();
      document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();

      if (row.is_complete) {
        document.getElementById('status-pill').className = 'px-3 py-1 rounded-3xl bg-[#F3F4F6] text-[#374151] text-sm font-medium flex items-center gap-1.5';
        document.getElementById('status-text').textContent = 'FINAL';
      }
    }

    async function loadInitial(shareId) {
      console.log('[FanView] loadInitial', shareId);
      const { data, error } = await supabase.from('matches').select('*').eq('share_id', shareId).single();
      if (error || !data) { console.error(error); return; }
      currentShareId = shareId;
      renderMatch(data);
      lastState = data;
      subscribeToChanges(shareId);
      startPolling(shareId);
    }

    function subscribeToChanges(shareId) {
      supabase.channel(`match:${shareId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'matches', filter: `share_id=eq.${shareId}` }, (p) => {
          console.log('[FanView] UPDATE', p.new);
          renderMatch(p.new);
          lastState = p.new;
        })
        .subscribe((s) => console.log('[FanView] sub status', s));
    }

    function startPolling(shareId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!currentShareId) return;
        const { data } = await supabase.from('matches').select('*').eq('share_id', currentShareId).single();
        if (data && JSON.stringify(data) !== JSON.stringify(lastState)) {
          console.log('[FanView] poll update');
          renderMatch(data);
          lastState = data;
        }
      }, 2000);
    }

    function manualRefresh() { if (currentShareId) loadInitial(currentShareId); }

    (async () => {
      const path = window.location.pathname;
      const match = path.match(/\/v\/([a-f0-9-]+)/);
      const shareId = match ? match[1] : null;
      if (!shareId) return;
      await supabase.auth.signInAnonymously().catch(() => {});
      await loadInitial(shareId);
    })();
  </script>
</body>
</html>
