<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />
    <title>CourtsideView — FanView</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #FAFAF7; --bg-elev: #FFFFFF;
        --ink: #0A0E1A; --ink-muted: #5C6470; --ink-dim: #9AA3AD;
        --border: #E5E5E0; --green: #0F8A4F; --red: #DC2626;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-feature-settings: "tnum" 1; min-height: 100vh; }
      .container { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
      header.brand { display: flex; align-items: center; gap: 10px;
        padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
      .brand-mark { font-size: 28px; }
      .brand-word { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      .live-pill { margin-left: auto; background: var(--red); color: #fff;
        font-size: 11px; font-weight: 700; letter-spacing: 1px;
        padding: 4px 10px; border-radius: 999px; display: none;
        align-items: center; gap: 6px; }
      .live-pill.on { display: inline-flex; }
      .live-pill .dot { width: 6px; height: 6px; border-radius: 50%;
        background: #fff; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
      .status { color: var(--ink-muted); font-size: 14px; padding: 80px 20px; text-align: center; }
      .status.err { color: var(--red); }
      .meta-row { text-align: center; color: var(--ink-muted); font-size: 12px;
        font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
      .team-tally { display: flex; justify-content: center; gap: 10px;
        font-size: 18px; font-weight: 600; margin-bottom: 24px; flex-wrap: wrap; }
      .dim { color: var(--ink-dim); }
      .scoreboard { background: var(--bg-elev); border: 1px solid var(--border);
        border-radius: 24px; padding: 28px 20px; margin-bottom: 16px; }
      .score-grid { display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: center; gap: 12px; }
      .side { text-align: center; }
      .side .name { font-size: 13px; font-weight: 700; letter-spacing: 1.4px;
        text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px;
        display: inline-flex; align-items: center; gap: 6px; }
      .side .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); }
      .score { font-family: Georgia, "Times New Roman", serif;
        font-size: 96px; line-height: 1; font-weight: 900;
        letter-spacing: -4px; font-variant-numeric: tabular-nums; }
      .divider { width: 36px; height: 36px; border-radius: 50%;
        background: var(--bg); border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        color: var(--ink-muted); font-size: 16px; }
      .target { text-align: center; margin-top: 22px; color: var(--ink-muted); font-size: 13px; }
      .refresh-row { display: flex; justify-content: center; margin-top: 8px; }
      .refresh-btn { background: var(--green); color: #fff; border: none;
        border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
        padding: 8px 18px; cursor: pointer; font-family: inherit; }
      .last-updated { text-align: center; color: var(--ink-dim); font-size: 11px; margin-top: 8px; }
      details.debug { margin-top: 28px; font-size: 11px;
        background: var(--bg-elev); border: 1px solid var(--border);
        border-radius: 12px; padding: 10px 12px; }
      details.debug summary { color: var(--ink-muted); cursor: pointer; font-weight: 600; }
      details.debug pre { margin: 8px 0 0; font-size: 10px; color: var(--ink-muted);
        white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
      .footer-hint { text-align: center; color: var(--ink-dim); font-size: 12px; padding: 20px; }
      .footer-hint a { color: var(--green); text-decoration: none; font-weight: 600; }
      .video-wrap { position: relative; margin-bottom: 20px; display: none; }
      .video-wrap.on { display: block; }
      .video-frame { position: relative; padding-bottom: 56.25%; height: 0;
        overflow: hidden; border-radius: 20px; background: #000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
      .video-frame iframe { position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; border: 0; }
      .video-live-pill { position: absolute; top: 12px; left: 12px; z-index: 2;
        background: var(--red); color: #fff; font-size: 11px; font-weight: 800;
        letter-spacing: 1.2px; padding: 4px 10px; border-radius: 999px;
        display: inline-flex; align-items: center; gap: 6px; }
      .video-live-pill .dot { width: 6px; height: 6px; border-radius: 50%;
        background: #fff; animation: pulse 1.4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="brand">
        <span class="brand-mark">🏐</span>
        <span class="brand-word">CourtsideView</span>
        <span id="livePill" class="live-pill"><span class="dot"></span>LIVE</span>
      </header>
      <div id="loading" class="status">Loading match…</div>
      <div id="errorBox" class="status err" style="display:none"></div>
      <main id="board" style="display:none">
        <div id="videoWrap" class="video-wrap">
          <div class="video-frame">
            <span id="videoLivePill" class="video-live-pill"><span class="dot"></span>LIVE</span>
            <iframe id="videoFrame"
              allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
        </div>
        <div class="meta-row" id="setLine">MATCH</div>
        <div class="team-tally" id="teamTally"></div>
        <div class="scoreboard">
          <div class="score-grid">
            <div class="side">
              <div class="name"><span class="dot" id="homeDot"></span><span id="homeName">Home</span></div>
              <div class="score" id="homeScore">0</div>
            </div>
            <div class="divider">—</div>
            <div class="side">
              <div class="name"><span class="dot" id="awayDot"></span><span id="awayName">Away</span></div>
              <div class="score" id="awayScore">0</div>
            </div>
          </div>
          <div class="target" id="targetLine"></div>
        </div>
        <div class="refresh-row">
          <button class="refresh-btn" onclick="forceRefresh()">↻ FORCE REFRESH</button>
        </div>
        <div class="last-updated" id="lastUpdated"></div>
        <details class="debug">
          <summary>Debug</summary>
          <pre id="debugBox"></pre>
        </details>
      </main>
      <div class="footer-hint">Powered by <a href="https://www.courtsideviewapp.com/">CourtsideView</a></div>
    </div>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.105.4';
      const SUPABASE_URL = 'https://gnzhdhagvahylcjmyeeh.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_91GTH_Tp2G0vGseUYUp9og_YtM-qlG0';
      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true },
      });
      function getShareId() {
        const m = window.location.pathname.match(/^\/v\/([^/?#]+)/);
        return m ? decodeURIComponent(m[1]) : null;
      }
      const $ = (id) => document.getElementById(id);
      function showError(msg) {
        $('loading').style.display='none'; $('board').style.display='none';
        $('errorBox').textContent = msg; $('errorBox').style.display='block';
      }
      function showBoard() {
        $('loading').style.display='none'; $('errorBox').style.display='none';
        $('board').style.display='block';
      }
      function readableTextColor(hex) {
        if (!hex || typeof hex !== 'string') return '#0A0E1A';
        const m = hex.replace('#','').match(/^([0-9a-f]{6})$/i);
        if (!m) return '#0A0E1A';
        const r = parseInt(hex.substr(1,2),16);
        const g = parseInt(hex.substr(3,2),16);
        const b = parseInt(hex.substr(5,2),16);
        return ((0.299*r+0.587*g+0.114*b)/255) > 0.75 ? '#0A0E1A' : hex;
      }
      function setsTarget(format, currentSet) {
        if (format === 'bo5') return currentSet === 5 ? 15 : 25;
        return currentSet === 3 ? 15 : 25;
      }
      function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
      function pick(state, k, fallback) { return (state && typeof state[k] === 'number') ? state[k] : fallback; }
      function extractYouTubeId(input) {
        if (!input) return null;
        const t = String(input).trim();
        if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
        const m = t.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
      }
      function renderVideo(row) {
        const vw = $('videoWrap');
        const vf = $('videoFrame');
        const pill = $('videoLivePill');
        const url = row && row.video_url;
        const type = row && row.video_type;
        if (!url || (type !== 'youtube' && type !== 'youtube_live')) {
          vw.classList.remove('on');
          if (vf.src) vf.src = '';
          return;
        }
        const id = extractYouTubeId(url);
        if (!id) {
          vw.classList.remove('on');
          if (vf.src) vf.src = '';
          return;
        }
        const newSrc = 'https://www.youtube.com/embed/' + encodeURIComponent(id) +
          '?autoplay=1&playsinline=1&rel=0&modestbranding=1';
        if (vf.src !== newSrc) vf.src = newSrc;
        vw.classList.add('on');
        pill.style.display = row.is_complete ? 'none' : 'inline-flex';
      }
      let matchRow = null;
      let shareId = null;
      function render() {
        if (!matchRow) return;
        const s = matchRow.state || {};
        const homeScore = pick(s,'homeScore', pick(s,'myTeamScore', 0));
        const awayScore = pick(s,'awayScore', pick(s,'opponentScore', 0));
        const currentSet = pick(s,'currentSet', 1);
        const homeSets = pick(s,'homeSetsWon', pick(s,'myTeamSetsWon', 0));
        const awaySets = pick(s,'awaySetsWon', pick(s,'opponentSetsWon', 0));
        const totalSets = pick(s,'totalSets', matchRow.format === 'bo5' ? 5 : 3);
        const setTarget = pick(s,'setTarget', setsTarget(matchRow.format, currentSet));
        $('homeName').textContent = (matchRow.home_name || 'Home').toUpperCase();
        $('awayName').textContent = (matchRow.away_name || 'Away').toUpperCase();
        $('homeDot').style.backgroundColor = matchRow.home_color || '#0F8A4F';
        $('awayDot').style.backgroundColor = matchRow.away_color || '#DC2626';
        $('homeScore').textContent = String(homeScore);
        $('awayScore').textContent = String(awayScore);
        if (homeScore > awayScore) {
          $('homeScore').style.color = readableTextColor(matchRow.home_color);
          $('awayScore').style.color = 'var(--ink-dim)';
        } else if (awayScore > homeScore) {
          $('awayScore').style.color = readableTextColor(matchRow.away_color);
          $('homeScore').style.color = 'var(--ink-dim)';
        } else {
          $('homeScore').style.color = 'var(--ink-muted)';
          $('awayScore').style.color = 'var(--ink-muted)';
        }
        if (matchRow.is_complete) {
          $('setLine').textContent = 'MATCH COMPLETE';
          $('livePill').classList.remove('on');
        } else {
          $('setLine').textContent = 'MATCH · SET ' + currentSet + ' OF ' + totalSets;
          $('livePill').classList.add('on');
        }
        $('teamTally').innerHTML =
          '<span style="color:' + readableTextColor(matchRow.home_color) + '">' + escapeHtml(matchRow.home_name || 'Home') + '</span>' +
          '<span class="dim"> ' + homeSets + ' </span><span class="dim">—</span><span class="dim"> ' + awaySets + ' </span>' +
          '<span style="color:' + readableTextColor(matchRow.away_color) + '">' + escapeHtml(matchRow.away_name || 'Away') + '</span>';
        $('targetLine').textContent = matchRow.is_complete ? '' : ('Playing to ' + setTarget);
        $('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        $('debugBox').textContent = JSON.stringify(matchRow, null, 2);
        renderVideo(matchRow);
        showBoard();
      }
      async function fetchMatch() {
        const { data, error } = await supabase
          .from('matches')
          .select('id, share_id, format, home_name, home_color, away_name, away_color, state, is_published, is_complete, video_url, video_type')
          .eq('share_id', shareId)
          .eq('is_published', true)
          .maybeSingle();
        if (error) { console.warn('[FanView] fetch error', error); return null; }
        return data;
      }
      window.forceRefresh = async () => {
        const fresh = await fetchMatch();
        if (fresh) { matchRow = fresh; render(); }
      };
      async function boot() {
        shareId = getShareId();
        if (!shareId) { showError('Missing share ID in the URL.'); return; }
        try { await supabase.auth.signInAnonymously(); } catch (e) { console.warn('[FanView] anon auth failed', e); }
        const initial = await fetchMatch();
        if (!initial) { showError('This match is not available. The link may be expired or unpublished.'); return; }
        matchRow = initial;
        render();
        const channel = supabase.channel('match:' + shareId);
        channel.on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'matches', filter: 'share_id=eq.' + shareId },
          (payload) => {
            if (!payload.new) return;
            console.log('[FanView] UPDATE', payload.new);
            matchRow = { ...matchRow, ...payload.new };
            render();
          });
        channel.subscribe((status, err) => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            console.warn('[FanView] channel status', status, err);
          } else {
            console.log('[FanView] channel status', status);
          }
        });
        setInterval(async () => {
          const fresh = await fetchMatch();
          if (!fresh) return;
          const stateChanged = JSON.stringify(fresh.state) !== JSON.stringify(matchRow.state ?? {});
          const videoChanged = fresh.video_url !== matchRow.video_url || fresh.video_type !== matchRow.video_type;
          const completeChanged = fresh.is_complete !== matchRow.is_complete;
          if (stateChanged || videoChanged || completeChanged) {
            console.log('[FanView] poll update');
            matchRow = fresh;
            render();
          }
        }, 2000);
      }
      boot().catch((err) => { console.error('[FanView] boot failed', err); showError('Something went wrong loading this match.'); });
    </script>
  </body>
</html>
