<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />
    <title>CourtsideView — FanView</title>
    <meta name="description" content="Live volleyball scoreboard." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #FAFAF7;
        --bg-elev: #FFFFFF;
        --ink: #0A0E1A;
        --ink-muted: #5C6470;
        --ink-dim: #9AA3AD;
        --border: #E5E5E0;
        --green: #0F8A4F;
        --red: #DC2626;
        --gold: #F59E0B;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-feature-settings: "tnum" 1;
      }
      body { min-height: 100vh; min-height: 100svh; }
      .container {
        max-width: 720px; margin: 0 auto; padding: 32px 20px 80px;
      }
      header.brand {
        display: flex; align-items: center; gap: 10px;
        padding-bottom: 24px; border-bottom: 1px solid var(--border);
        margin-bottom: 28px;
      }
      .brand-mark { font-size: 28px; line-height: 1; }
      .brand-word { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      .live-pill {
        margin-left: auto;
        background: var(--red); color: #fff;
        font-size: 11px; font-weight: 700; letter-spacing: 1px;
        padding: 4px 10px; border-radius: 999px;
        display: none;
      }
      .live-pill.is-on { display: inline-flex; align-items: center; gap: 6px; }
      .live-pill .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #fff; animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .status {
        color: var(--ink-muted); font-size: 14px;
        padding: 80px 20px; text-align: center;
      }
      .status.err { color: var(--red); }
      .meta-row {
        display: flex; justify-content: center; gap: 6px;
        color: var(--ink-muted); font-size: 12px;
        font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
        margin-bottom: 8px;
      }
      .team-tally {
        display: flex; justify-content: center; align-items: baseline;
        gap: 10px; font-size: 18px; font-weight: 600;
        margin-bottom: 24px; flex-wrap: wrap;
      }
      .team-tally .home, .team-tally .away { white-space: nowrap; }
      .team-tally .dim { color: var(--ink-dim); }
      .scoreboard {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px 20px;
        box-shadow: 0 1px 0 rgba(0,0,0,0.02);
        margin-bottom: 32px;
      }
      .score-grid {
        display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: center; gap: 12px;
      }
      .side { text-align: center; }
      .side .name {
        font-size: 13px; font-weight: 700;
        letter-spacing: 1.4px; text-transform: uppercase;
        color: var(--ink-muted);
        margin-bottom: 10px;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .side .dot {
        width: 10px; height: 10px; border-radius: 50%;
        border: 1px solid var(--border);
      }
      .score {
        font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
        font-size: 96px; line-height: 1; font-weight: 900;
        letter-spacing: -4px; font-variant-numeric: tabular-nums;
      }
      .score.leading { /* color set inline from team color */ }
      .score.muted { color: var(--ink-dim); }
      .divider {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--bg); border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        color: var(--ink-muted); font-size: 16px;
      }
      .target {
        text-align: center; margin-top: 22px;
        color: var(--ink-muted); font-size: 13px;
      }
      .footer-hint {
        text-align: center; color: var(--ink-dim); font-size: 12px;
        padding: 20px;
      }
      .footer-hint a { color: var(--green); text-decoration: none; font-weight: 600; }
      .footer-hint a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="brand">
        <span class="brand-mark">🏐</span>
        <span class="brand-word">CourtsideView</span>
        <span id="livePill" class="live-pill"><span class="dot"></span>LIVE</span>
      </header>

      <div id="loading" class="status">Loading match…</div>
      <div id="errorBox" class="status err" style="display:none"></div>

      <main id="board" style="display:none">
        <div class="meta-row" id="setLine">MATCH</div>
        <div class="team-tally" id="teamTally"></div>

        <div class="scoreboard">
          <div class="score-grid">
            <div class="side">
              <div class="name">
                <span class="dot" id="homeDot"></span>
                <span id="homeName">Home</span>
              </div>
              <div class="score" id="homeScore">0</div>
            </div>
            <div class="divider">—</div>
            <div class="side">
              <div class="name">
                <span class="dot" id="awayDot"></span>
                <span id="awayName">Away</span>
              </div>
              <div class="score" id="awayScore">0</div>
            </div>
          </div>
          <div class="target" id="targetLine"></div>
        </div>
      </main>

      <div class="footer-hint">
        Powered by <a href="https://www.courtsideviewapp.com/">CourtsideView</a>
      </div>
    </div>

    <script type="module">
      // -----------------------------------------------------------------
      // FanView spectator page.
      // Reads `shareId` from the URL path: /v/<shareId>
      // Connects to Supabase, fetches the match row, then subscribes to
      // the `game:<shareId>` Realtime channel and updates the scoreboard.
      // -----------------------------------------------------------------
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.105.4';

      const SUPABASE_URL = 'https://gnzhdhagvahylcjmyeeh.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_91GTH_Tp2G0vGseUYUp9og_YtM-qlG0';

      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false },
      });

      // Extract shareId from /v/<shareId> path.
      function getShareId() {
        const m = window.location.pathname.match(/^\/v\/([^/?#]+)/);
        return m ? decodeURIComponent(m[1]) : null;
      }

      const $loading = document.getElementById('loading');
      const $error = document.getElementById('errorBox');
      const $board = document.getElementById('board');
      const $livePill = document.getElementById('livePill');
      const $setLine = document.getElementById('setLine');
      const $teamTally = document.getElementById('teamTally');
      const $homeName = document.getElementById('homeName');
      const $awayName = document.getElementById('awayName');
      const $homeDot = document.getElementById('homeDot');
      const $awayDot = document.getElementById('awayDot');
      const $homeScore = document.getElementById('homeScore');
      const $awayScore = document.getElementById('awayScore');
      const $targetLine = document.getElementById('targetLine');

      function showError(msg) {
        $loading.style.display = 'none';
        $board.style.display = 'none';
        $error.textContent = msg;
        $error.style.display = 'block';
      }

      function showBoard() {
        $loading.style.display = 'none';
        $error.style.display = 'none';
        $board.style.display = 'block';
      }

      // Pick a readable text color against the cream bg. Returns the team
      // color if its contrast vs #FAFAF7 is acceptable, else falls back
      // to a darker shade.
      function readableTextColor(hex) {
        if (!hex || typeof hex !== 'string') return '#0A0E1A';
        const m = hex.replace('#', '').match(/^([0-9a-f]{6})$/i);
        if (!m) return '#0A0E1A';
        const r = parseInt(hex.substr(1, 2), 16);
        const g = parseInt(hex.substr(3, 2), 16);
        const b = parseInt(hex.substr(5, 2), 16);
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum > 0.75 ? '#0A0E1A' : hex;
      }

      function setsTarget(format, currentSet) {
        if (format === 'bo5') return currentSet === 5 ? 15 : 25;
        return currentSet === 3 ? 15 : 25;
      }

      // ----- Rendering --------------------------------------------------
      let matchRow = null;

      function render() {
        if (!matchRow) return;
        const state = matchRow.state || {};
        const homeScore = Number(state.myTeamScore ?? state.homeScore ?? 0);
        const awayScore = Number(state.opponentScore ?? state.awayScore ?? 0);
        const currentSet = Number(state.currentSet ?? 1);
        const homeSets = Number(state.myTeamSetsWon ?? state.homeSetsWon ?? 0);
        const awaySets = Number(state.opponentSetsWon ?? state.awaySetsWon ?? 0);

        $homeName.textContent = (matchRow.home_name || 'Home').toUpperCase();
        $awayName.textContent = (matchRow.away_name || 'Away').toUpperCase();
        $homeDot.style.backgroundColor = matchRow.home_color || '#0F8A4F';
        $awayDot.style.backgroundColor = matchRow.away_color || '#DC2626';

        $homeScore.textContent = String(homeScore);
        $awayScore.textContent = String(awayScore);

        if (homeScore > awayScore) {
          $homeScore.style.color = readableTextColor(matchRow.home_color);
          $awayScore.style.color = 'var(--ink-dim)';
        } else if (awayScore > homeScore) {
          $awayScore.style.color = readableTextColor(matchRow.away_color);
          $homeScore.style.color = 'var(--ink-dim)';
        } else {
          $homeScore.style.color = 'var(--ink-muted)';
          $awayScore.style.color = 'var(--ink-muted)';
        }

        const totalSets = matchRow.format === 'bo5' ? 5 : 3;
        if (matchRow.is_complete) {
          $setLine.textContent = 'MATCH COMPLETE';
          $livePill.classList.remove('is-on');
        } else {
          $setLine.textContent = `MATCH · SET ${currentSet} OF ${totalSets}`;
          $livePill.classList.add('is-on');
        }

        $teamTally.innerHTML =
          `<span class="home" style="color:${readableTextColor(matchRow.home_color)}">${escapeHtml(matchRow.home_name || 'Home')}</span>` +
          `<span class="dim"> ${homeSets} </span>` +
          `<span class="dim">—</span>` +
          `<span class="dim"> ${awaySets} </span>` +
          `<span class="away" style="color:${readableTextColor(matchRow.away_color)}">${escapeHtml(matchRow.away_name || 'Away')}</span>`;

        const target = setsTarget(matchRow.format, currentSet);
        $targetLine.textContent = matchRow.is_complete ? '' : `Playing to ${target}`;

        showBoard();
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = String(s ?? '');
        return div.innerHTML;
      }

      // ----- Boot -------------------------------------------------------
      async function boot() {
        const shareId = getShareId();
        if (!shareId) {
          showError('Missing share ID in the URL.');
          return;
        }

        const { data, error } = await supabase
          .from('matches')
          .select(
            'id, share_id, format, home_name, home_color, away_name, away_color, state, is_published, is_complete'
          )
          .eq('share_id', shareId)
          .eq('is_published', true)
          .maybeSingle();

        if (error) {
          showError(`Couldn't load match. ${error.message}`);
          return;
        }
        if (!data) {
          showError('This match is not available. The link may be expired or unpublished.');
          return;
        }

        matchRow = data;
        render();

        // Subscribe to Realtime broadcast updates.
        const channel = supabase.channel(`game:${shareId}`, {
          config: { broadcast: { self: false } },
        });

        channel.on('broadcast', { event: 'score' }, ({ payload }) => {
          if (!payload) return;
          matchRow = {
            ...matchRow,
            state: {
              ...(matchRow.state || {}),
              ...(payload.homeScore !== undefined ? { homeScore: payload.homeScore } : {}),
              ...(payload.awayScore !== undefined ? { awayScore: payload.awayScore } : {}),
              ...(payload.currentSet !== undefined ? { currentSet: payload.currentSet } : {}),
            },
          };
          render();
        });

        channel.on('broadcast', { event: 'state' }, ({ payload }) => {
          if (!payload) return;
          matchRow = { ...matchRow, state: { ...(matchRow.state || {}), ...payload } };
          render();
        });

        channel.subscribe();
      }

      boot().catch((err) => {
        console.error('FanView boot failed', err);
        showError('Something went wrong loading this match.');
      });
    </script>
  </body>
</html>
