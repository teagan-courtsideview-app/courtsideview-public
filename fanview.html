<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtsideView • Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Source+Serif+4:wght@700&amp;display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
    .score { font-family: 'Source Serif 4', Georgia, serif; font-size: 72px; line-height: 1; font-weight: 700; }
    .live-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-[#0B0F1C] text-white">
  <div class="max-w-[420px] mx-auto min-h-screen flex flex-col">
    <!-- Header -->
    <div class="px-6 pt-8 pb-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-[#22C55E] rounded-2xl flex items-center justify-center">
          <span class="text-[#0B0F1C] text-2xl font-black">CV</span>
        </div>
        <div>
          <div class="font-semibold text-xl tracking-tight">CourtsideView</div>
          <div class="text-[11px] text-[#94A0B8] -mt-1">LIVE</div>
        </div>
      </div>
      
      <div id="status-pill" class="px-3 py-1 rounded-3xl bg-[#141B30] flex items-center gap-2 text-sm border border-[#2B3454]">
        <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-[#22C55E]"></div>
        <span id="status-text" class="font-medium text-[#22C55E]">LIVE</span>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="px-6">
      <div class="bg-[#141B30] rounded-3xl p-6 border border-[#2B3454]">
        <div class="flex items-center justify-between mb-6">
          <div class="text-center flex-1">
            <div id="home-name" class="text-[#C9D0E0] text-sm font-medium tracking-[0.5px]">HOME</div>
            <div id="home-score" class="score text-white tabular-nums">0</div>
          </div>
          
          <div class="px-4">
            <div class="text-[10px] text-[#94A0B8] text-center mb-1">SET</div>
            <div id="current-set" class="inline-flex items-center justify-center w-9 h-9 rounded-2xl bg-[#22C55E] text-[#0B0F1C] text-xl font-black">1</div>
          </div>
          
          <div class="text-center flex-1">
            <div id="away-name" class="text-[#C9D0E0] text-sm font-medium tracking-[0.5px]">AWAY</div>
            <div id="away-score" class="score text-white tabular-nums">0</div>
          </div>
        </div>
        
        <div id="set-strip" class="flex gap-2 justify-center text-xs text-[#94A0B8]"></div>
      </div>
    </div>

    <!-- Live feed -->
    <div class="flex-1 px-6 pt-6 pb-8">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="text-sm font-semibold text-[#C9D0E0]">LIVE ACTIVITY</div>
        <button onclick="manualRefresh()" class="text-xs px-3 py-1 bg-[#141B30] hover:bg-[#2B3454] rounded-2xl border border-[#2B3454] transition-colors">REFRESH</button>
      </div>
      
      <div id="feed" class="space-y-2 text-sm max-h-[420px] overflow-auto pr-1"></div>
      <div id="empty-feed" class="hidden text-center py-8 text-[#94A0B8] text-sm">Match starting… no events yet</div>
    </div>

    <div class="px-6 pb-8 text-[10px] text-center text-[#94A0B8]">
      Updates every ~3 seconds • Powered by Supabase Realtime
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    let currentShareId = null;
    let lastState = null;
    let pollInterval = null;

    function setStatus(status, color = '#22C55E') {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const pill = document.getElementById('status-pill');
      
      if (status === 'LIVE') {
        dot.style.backgroundColor = '#22C55E';
        text.textContent = 'LIVE';
        text.style.color = '#22C55E';
      } else if (status === 'FINAL') {
        dot.style.backgroundColor = '#94A0B8';
        text.textContent = 'FINAL';
        text.style.color = '#94A0B8';
      } else {
        dot.style.backgroundColor = '#F59E0B';
        text.textContent = status;
        text.style.color = '#F59E0B';
      }
    }

    async function loadInitial(shareId) {
      const { data, error } = await supabase.from('matches').select('*').eq('share_id', shareId).single();
      if (error || !data) {
        document.getElementById('feed').innerHTML = `<div class="text-red-400 text-sm p-4">Match not found or expired.</div>`;
        return;
      }
      currentShareId = shareId;
      renderMatch(data);
      lastState = data;
      subscribeToChanges(shareId);
      startPolling(shareId);
      setStatus('LIVE');
    }

    function renderMatch(row) {
      const state = row.state || {};
      document.getElementById('home-score').textContent = state.homeScore ?? 0;
      document.getElementById('away-score').textContent = state.awayScore ?? 0;
      document.getElementById('current-set').textContent = state.currentSet ?? 1;
      document.getElementById('home-name').textContent = row.home_name?.toUpperCase() || 'HOME';
      document.getElementById('away-name').textContent = row.away_name?.toUpperCase() || 'AWAY';

      const strip = document.getElementById('set-strip');
      strip.innerHTML = '';
      if (state.setScores && Array.isArray(state.setScores)) {
        state.setScores.forEach((s, i) => {
          const el = document.createElement('div');
          el.className = 'px-2.5 py-1 bg-[#0B0F1C] rounded-xl text-xs border border-[#2B3454]';
          el.textContent = `S${i+1} ${s[0]}-${s[1]}`;
          strip.appendChild(el);
        });
      }
      renderEvents(row.events || []);
      if (row.is_complete) setStatus('FINAL');
    }

    function renderEvents(events) {
      const container = document.getElementById('feed');
      const empty = document.getElementById('empty-feed');
      if (!events.length) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      container.innerHTML = events.slice().reverse().map(ev => {
        const time = new Date(ev.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `<div class="flex items-start gap-3 bg-[#141B30] border border-[#2B3454] rounded-2xl px-4 py-3">
          <div class="text-[#94A0B8] text-xs w-9 shrink-0 pt-0.5">#${ev.sequence || ''}</div>
          <div class="flex-1"><div class="font-medium">${ev.event_type}</div>${ev.payload?.playerName ? `<div class="text-[#C9D0E0] text-xs">${ev.payload.playerName}</div>` : ''}</div>
          <div class="text-[#94A0B8] text-xs pt-0.5">${time}</div></div>`;
      }).join('');
    }

    function subscribeToChanges(shareId) {
      supabase.channel(`match:${shareId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'matches', filter: `share_id=eq.${shareId}` }, (payload) => {
          console.log('[FanView] UPDATE received');
          renderMatch(payload.new);
          lastState = payload.new;
          setStatus('LIVE');
        })
        .subscribe();
    }

    function startPolling(shareId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!currentShareId) return;
        const { data } = await supabase.from('matches').select('*').eq('share_id', currentShareId).single();
        if (data && JSON.stringify(data) !== JSON.stringify(lastState)) {
          renderMatch(data);
          lastState = data;
          setStatus('LIVE');
        }
      }, 3000);
    }

    function manualRefresh() {
      if (currentShareId) loadInitial(currentShareId);
    }

    (async () => {
      const path = window.location.pathname;
      const match = path.match(/\/v\/([a-f0-9-]+)/);
      const shareId = match ? match[1] : null;
      if (!shareId) {
        document.body.innerHTML = `<div class="p-8 text-center text-red-400">Invalid link.</div>`;
        return;
      }
      await supabase.auth.signInAnonymously().catch(() => {});
      await loadInitial(shareId);
    })();
  </script>
</body>
</html>
